name: Build macOS only
run-name: Build macOS tunnelgram

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Upload archives to an existing GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag, for example v2.0"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  SING_BOX_VERSION: "1.13.14"

jobs:
  build-macos:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            archive: tunnelgram-macos-arm64.zip
            core_asset: sing-box-1.13.14-darwin-arm64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            archive: tunnelgram-macos-x64.zip
            core_asset: sing-box-1.13.14-darwin-amd64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.0" pytest
          python -m compileall tunnelgram
          python -m py_compile tunnelgram_app.py
          python -m pytest -q

      - name: Download sing-box core
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}"
          curl -fL "$base/${{ matrix.core_asset }}" -o sing-box-core.tar.gz
          mkdir sing-box-core
          tar -xzf sing-box-core.tar.gz -C sing-box-core
          core="$(find sing-box-core -type f -name sing-box -print -quit)"
          test -n "$core"
          cp "$core" sing-box
          chmod +x sing-box
          curl -fL "https://raw.githubusercontent.com/SagerNet/sing-box/v${SING_BOX_VERSION}/LICENSE" -o sing-box-LICENSE.txt

      - name: Build application archive
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name tunnelgram \
            --add-data "assets:assets" \
            tunnelgram_app.py

          app="dist/tunnelgram.app"
          mkdir -p "$app/Contents/Resources"
          cp sing-box "$app/Contents/Resources/sing-box"
          chmod +x "$app/Contents/Resources/sing-box"
          cp THIRD_PARTY_NOTICES.md "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          cp sing-box-LICENSE.txt "$app/Contents/Resources/sing-box-GPL-3.0.txt"
          codesign --force --deep --sign - "$app"

          mkdir -p release/THIRD_PARTY_LICENSES
          cp -R "$app" release/tunnelgram.app
          cp sing-box-LICENSE.txt release/THIRD_PARTY_LICENSES/sing-box-GPL-3.0.txt
          printf '%s\n' "https://github.com/SagerNet/sing-box/tree/v${SING_BOX_VERSION}" > release/THIRD_PARTY_LICENSES/sing-box-source.txt
          cp README.md THIRD_PARTY_NOTICES.md release/
          (cd release && ditto -c -k --sequesterRsrc . "../${{ matrix.archive }}")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: inputs.upload_to_release && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "${{ inputs.release_tag }}" "${{ matrix.archive }}" --clobber
