name: Python check

on:
  push:
  pull_request:

jobs:
  check:
    name: Import and syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall tunnelgram

      - name: Import core project modules
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "tunnelgram",
              "tunnelgram.local_proxy",
              "tunnelgram.telegram_ws",
              "tunnelgram.mtproto",
              "tunnelgram.faketls",
              "tunnelgram.diagnostics",
          ]

          for name in modules:
              importlib.import_module(name)
              print(f"OK: {name}")
          PY
