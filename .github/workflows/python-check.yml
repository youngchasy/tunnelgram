name: Python check

on:
  push:
  pull_request:

jobs:
  check:
    name: Import and syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system tkinter package
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall tunnelgram

      - name: Import project modules
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "tunnelgram.gui",
              "tunnelgram.proxy",
          ]

          for name in modules:
              importlib.import_module(name)
              print(f"OK: {name}")
          PY
