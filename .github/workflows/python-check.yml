name: Python check

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  check:
    name: Import, syntax and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python files
        run: |
          python -m compileall tunnelgram
          python -m py_compile tunnelgram_app.py

      - name: Import core project modules
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "tunnelgram",
              "tunnelgram.local_proxy",
              "tunnelgram.telegram_ws",
              "tunnelgram.mtproto",
              "tunnelgram.faketls",
              "tunnelgram.diagnostics",
              "tunnelgram.proxy_profiles",
          ]

          for name in modules:
              importlib.import_module(name)
              print(f"OK: {name}")
          PY

      - name: Run tests
        run: python -m pytest -q
