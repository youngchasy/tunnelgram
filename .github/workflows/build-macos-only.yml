name: Build macOS only
run-name: Build macOS tunnelgram

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Upload archive to existing GitHub Release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_tag:
        description: "v0.1.2"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.0"

      - name: Compile Python files
        run: |
          python -m compileall tunnelgram
          python -m py_compile tunnelgram_app.py

      - name: Build macOS app
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name tunnelgram \
            --add-data "assets:assets" \
            tunnelgram_app.py

          codesign --force --deep --sign - "dist/tunnelgram.app"

          mkdir -p release
          cp -R dist/tunnelgram.app release/tunnelgram.app
          [ -f README.md ] && cp README.md release/README.md || true
          [ -f LICENSE ] && cp LICENSE release/LICENSE || true

          ditto -c -k --sequesterRsrc --keepParent release tunnelgram-macos.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnelgram-macos.zip
          path: tunnelgram-macos.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.upload_to_release == 'true' && github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.inputs.release_tag }}" tunnelgram-macos.zip --clobber
